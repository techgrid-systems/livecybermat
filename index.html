<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techgrid Systems - Live Cyber Threat Map</title>
  <style>
    :root {
      --bg-dark: #080b11;
      --panel-bg: rgba(14, 20, 32, 0.85);
      --panel-border: #1e293b;
      --primary-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --threat-red: #ef4444;
      --threat-orange: #f97316;
      --threat-yellow: #eab308;
      --threat-purple: #a855f7;
      --threat-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* Main Grid Layout */
    .dashboard-container {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      grid-template-rows: 1fr 140px;
      height: 100vh;
      width: 100vw;
      gap: 12px;
      padding: 12px;
    }

    /* Common Panel Styling */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary-cyan);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    /* LEFT SIDEBAR */
    .left-sidebar {
      grid-column: 1;
      grid-row: 1;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .filter-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .filter-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid var(--text-muted);
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .filter-item input[type="checkbox"]:checked {
      background-color: var(--primary-cyan);
      border-color: var(--primary-cyan);
    }

    .filter-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #000;
      font-size: 11px;
      font-weight: bold;
      top: -1px;
      left: 3px;
    }

    .color-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* CENTER MAP */
    .map-container {
      grid-column: 2;
      grid-row: 1;
      position: relative;
      background: #04060a;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas#threatMap {
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .map-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-btn:hover {
      background: var(--primary-cyan);
      color: #000;
    }

    /* RIGHT SIDEBAR */
    .right-sidebar {
      grid-column: 3;
      grid-row: 1;
      gap: 12px;
      overflow-y: auto;
    }

    .interval-selector {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .interval-selector option {
      background: #0f172a;
      color: var(--text-main);
    }

    .table-container {
      margin-bottom: 12px;
    }

    .table-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 6px 8px;
      text-align: left;
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--panel-border);
    }

    td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .percentage-cell {
      text-align: right;
      font-weight: bold;
      color: var(--primary-cyan);
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.05);
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 3px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary-cyan);
    }

    /* BOTTOM LIVE FEED */
    .bottom-feed {
      grid-column: 1 / span 3;
      grid-row: 2;
    }

    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      height: 100%;
      font-family: monospace;
      font-size: 12px;
    }

    .feed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid var(--primary-cyan);
      border-radius: 4px;
    }

    .feed-type {
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      text-transform: uppercase;
    }

    .type-web { background: rgba(239, 68, 68, 0.2); color: var(--threat-red); }
    .type-ddos { background: rgba(249, 115, 22, 0.2); color: var(--threat-orange); }
    .type-intruder { background: rgba(234, 179, 8, 0.2); color: var(--threat-yellow); }
    .type-scammer { background: rgba(168, 85, 247, 0.2); color: var(--threat-purple); }
    .type-anonymizer { background: rgba(16, 185, 129, 0.2); color: var(--threat-green); }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- LEFT PANEL: LOGO & ATTACK TYPE CHECKBOXES -->
    <div class="panel left-sidebar">
      <div class="brand-header">
        <img src="https://icons.techgrid-systems.org.uk/tgs-primary.png" alt="Techgrid Systems" class="brand-logo" onerror="this.src='https://via.placeholder.com/180x50/0e1420/06b6d4?text=Techgrid+Systems'">
        <span class="brand-title">Threat Intelligence Center</span>
      </div>

      <div class="panel-header">Attack Filters</div>

      <div class="filter-group">
        <label class="filter-item">
          <input type="checkbox" id="chk-web" checked>
          <span class="color-indicator" style="background: var(--threat-red);"></span>
          Web Attackers
        </label>

        <label class="filter-item">
          <input type="checkbox" id="chk-ddos" checked>
          <span class="color-indicator" style="background: var(--threat-orange);"></span>
          DDoS Attackers
        </label>

        <label class="filter-item">
          <input type="checkbox" id="chk-intruders" checked>
          <span class="color-indicator" style="background: var(--threat-yellow);"></span>
          Intruders
        </label>

        <label class="filter-item">
          <input type="checkbox" id="chk-scammers" checked>
          <span class="color-indicator" style="background: var(--threat-purple);"></span>
          Scammers
        </label>

        <label class="filter-item">
          <input type="checkbox" id="chk-anonymizers" checked>
          <span class="color-indicator" style="background: var(--threat-green);"></span>
          Anonymizers
        </label>
      </div>
    </div>

    <!-- CENTER PANEL: 2D MAP -->
    <div class="map-container">
      <div class="map-controls">
        <button class="map-btn" id="btn-zoom-in">+</button>
        <button class="map-btn" id="btn-zoom-out">-</button>
        <button class="map-btn" id="btn-reset">↺</button>
      </div>
      <canvas id="threatMap"></canvas>
    </div>

    <!-- RIGHT PANEL: TIMEFRAME & STATS TABLES -->
    <div class="panel right-sidebar">
      <div class="panel-header">Threat Statistics</div>

      <select class="interval-selector" id="interval-select">
        <option value="1h">Last 1 Hour</option>
        <option value="24h" selected>Last 24 Hours</option>
        <option value="1w">Last 1 Week</option>
        <option value="1m">Last 1 Month</option>
      </select>

      <!-- Top Attackers by Country -->
      <div class="table-container">
        <div class="table-title">Top Attackers by Country</div>
        <table>
          <thead>
            <tr>
              <th>Country</th>
              <th style="text-align: right;">Share</th>
            </tr>
          </thead>
          <tbody id="tbl-countries"></tbody>
        </table>
      </div>

      <!-- Top Network Attack Vectors -->
      <div class="table-container">
        <div class="table-title">Top Network Attack Vectors</div>
        <table>
          <thead>
            <tr>
              <th>Vector</th>
              <th style="text-align: right;">Share</th>
            </tr>
          </thead>
          <tbody id="tbl-vectors"></tbody>
        </table>
      </div>

      <!-- Top Application Violations -->
      <div class="table-container">
        <div class="table-title">Top Application Violations</div>
        <table>
          <thead>
            <tr>
              <th>Violation</th>
              <th style="text-align: right;">Share</th>
            </tr>
          </thead>
          <tbody id="tbl-violations"></tbody>
        </table>
      </div>
    </div>

    <!-- BOTTOM PANEL: CURRENT THREATS FEED -->
    <div class="panel bottom-feed">
      <div class="panel-header">
        <span>Live Threat Feed Stream</span>
        <span style="font-size: 10px; color: var(--threat-green);">● REAL-TIME MONITORING</span>
      </div>
      <div class="feed-list" id="feed-list"></div>
    </div>
  </div>

  <script>
    // Global Coordinates & Map Config
    const canvas = document.getElementById('threatMap');
    const ctx = canvas.getContext('2d');
    
    let zoom = 1;
    let panX = 0;
    let panY = 0;

    const cities = [
      { name: "London", lat: 51.5074, lng: -0.1278 },
      { name: "New York", lat: 40.7128, lng: -74.0060 },
      { name: "Tokyo", lat: 35.6762, lng: 139.6503 },
      { name: "Frankfurt", lat: 50.1109, lng: 8.6821 },
      { name: "Sydney", lat: -33.8688, lng: 151.2093 },
      { name: "Beijing", lat: 39.9042, lng: 116.4074 },
      { name: "São Paulo", lat: -23.5505, lng: -46.6333 },
      { name: "Moscow", lat: 55.7558, lng: 37.6173 },
      { name: "Singapore", lat: 1.3521, lng: 103.8198 },
      { name: "Los Angeles", lat: 34.0522, lng: -118.2437 }
    ];

    const attackTypes = {
      web: { label: "Web Attacker", color: "#ef4444", class: "type-web", checkId: "chk-web" },
      ddos: { label: "DDoS Attacker", color: "#f97316", class: "type-ddos", checkId: "chk-ddos" },
      intruders: { label: "Intruder", color: "#eab308", class: "type-intruder", checkId: "chk-intruders" },
      scammers: { label: "Scammer", color: "#a855f7", class: "type-scammer", checkId: "chk-scammers" },
      anonymizers: { label: "Anonymizer", color: "#10b981", class: "type-anonymizer", checkId: "chk-anonymizers" }
    };

    let activeArcs = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Map Projection helper
    function geoToCanvas(lat, lng) {
      const x = ((lng + 180) / 360) * canvas.width;
      const y = ((90 - lat) / 180) * canvas.height;
      return { 
        x: (x * zoom) + panX + (canvas.width * (1 - zoom) / 2), 
        y: (y * zoom) + panY + (canvas.height * (1 - zoom) / 2) 
      };
    }

    // Spawn Arc
    function spawnAttackArc() {
      const activeKeys = Object.keys(attackTypes).filter(k => document.getElementById(attackTypes[k].checkId).checked);
      if (activeKeys.length === 0) return;

      const typeKey = activeKeys[Math.floor(Math.random() * activeKeys.length)];
      const type = attackTypes[typeKey];

      const src = cities[Math.floor(Math.random() * cities.length)];
      let dst = cities[Math.floor(Math.random() * cities.length)];
      while (dst === src) dst = cities[Math.floor(Math.random() * cities.length)];

      activeArcs.push({
        src, dst, type: typeKey, color: type.color,
        progress: 0,
        speed: 0.005 + Math.random() * 0.01
      });

      addFeedEntry(src, dst, typeKey);
    }

    // Render 2D Map Canvas
    function renderMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw Cities
      cities.forEach(city => {
        const pos = geoToCanvas(city.lat, city.lng);
        ctx.fillStyle = "#06b6d4";
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(148, 163, 184, 0.6)";
        ctx.font = "10px sans-serif";
        ctx.fillText(city.name, pos.x + 6, pos.y + 3);
      });

      // Render Arcs
      activeArcs.forEach((arc, idx) => {
        arc.progress += arc.speed;
        if (arc.progress >= 1) {
          activeArcs.splice(idx, 1);
          return;
        }

        const start = geoToCanvas(arc.src.lat, arc.src.lng);
        const end = geoToCanvas(arc.dst.lat, arc.dst.lng);

        const midX = (start.x + end.x) / 2;
        const midY = (start.y + end.y) / 2 - 50;

        ctx.strokeStyle = arc.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.quadraticCurveTo(midX, midY, end.x, end.y);
        ctx.stroke();

        // Animated Particle
        const t = arc.progress;
        const px = (1 - t) * (1 - t) * start.x + 2 * (1 - t) * t * midX + t * t * end.x;
        const py = (1 - t) * (1 - t) * start.y + 2 * (1 - t) * t * midY + t * t * end.y;

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(renderMap);
    }

    // Add Live Threat Feed Entry
    const feedList = document.getElementById('feed-list');
    function addFeedEntry(src, dst, typeKey) {
      const type = attackTypes[typeKey];
      const time = new Date().toLocaleTimeString();
      const ip = `${Math.floor(Math.random()*200)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;

      const item = document.createElement('div');
      item.className = 'feed-item';
      item.innerHTML = `
        <span>[${time}] IP: ${ip} (${src.name})</span>
        <span class="feed-type ${type.class}">${type.label}</span>
        <span>Target: ${dst.name}</span>
      `;

      feedList.prepend(item);
      if (feedList.children.length > 20) feedList.removeChild(feedList.lastChild);
    }

    // Statistics Data Generator
    const statsData = {
      "1h": {
        countries: [ { name: "United States", val: 32 }, { name: "China", val: 24 }, { name: "Russia", val: 18 }, { name: "Brazil", val: 14 }, { name: "Germany", val: 12 } ],
        vectors: [ { name: "UDP Flood", val: 41 }, { name: "SYN Flood", val: 29 }, { name: "NTP Amplification", val: 18 }, { name: "ICMP Reflection", val: 12 } ],
        violations: [ { name: "SQL Injection", val: 38 }, { name: "HTTP Flood", val: 28 }, { name: "Cross-Site Scripting (XSS)", val: 20 }, { name: "Remote Code Execution", val: 14 } ]
      },
      "24h": {
        countries: [ { name: "China", val: 35 }, { name: "United States", val: 28 }, { name: "Russia", val: 15 }, { name: "India", val: 12 }, { name: "Netherlands", val: 10 } ],
        vectors: [ { name: "SYN Flood", val: 36 }, { name: "UDP Flood", val: 32 }, { name: "DNS Amplification", val: 20 }, { name: "ACK Flood", val: 12 } ],
        violations: [ { name: "HTTP Flood", val: 35 }, { name: "SQL Injection", val: 31 }, { name: "Cross-Site Scripting (XSS)", val: 18 }, { name: "Path Traversal", val: 16 } ]
      },
      "1w": {
        countries: [ { name: "Russia", val: 30 }, { name: "China", val: 28 }, { name: "United States", val: 22 }, { name: "Vietnam", val: 11 }, { name: "Brazil", val: 9 } ],
        vectors: [ { name: "UDP Flood", val: 45 }, { name: "NTP Amplification", val: 25 }, { name: "SYN Flood", val: 18 }, { name: "GRE Flood", val: 12 } ],
        violations: [ { name: "SQL Injection", val: 42 }, { name: "HTTP Flood", val: 26 }, { name: "Command Injection", val: 18 }, { name: "XSS", val: 14 } ]
      },
      "1m": {
        countries: [ { name: "United States", val: 34 }, { name: "China", val: 29 }, { name: "Russia", val: 17 }, { name: "Germany", val: 11 }, { name: "United Kingdom", val: 9 } ],
        vectors: [ { name: "SYN Flood", val: 39 }, { name: "UDP Flood", val: 31 }, { name: "DNS Amplification", val: 18 }, { name: "ICMP Flood", val: 12 } ],
        violations: [ { name: "HTTP Flood", val: 37 }, { name: "SQL Injection", val: 29 }, { name: "RCE", val: 21 }, { name: "XSS", val: 13 } ]
      }
    };

    function updateTables(interval) {
      const data = statsData[interval] || statsData["24h"];

      const renderTbl = (elementId, list) => {
        const tbody = document.getElementById(elementId);
        tbody.innerHTML = list.map(item => `
          <tr>
            <td>
              ${item.name}
              <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${item.val}%"></div></div>
            </td>
            <td class="percentage-cell">${item.val}%</td>
          </tr>
        `).join('');
      };

      renderTbl('tbl-countries', data.countries);
      renderTbl('tbl-vectors', data.vectors);
      renderTbl('tbl-violations', data.violations);
    }

    document.getElementById('interval-select').addEventListener('change', (e) => {
      updateTables(e.target.value);
    });

    // Map Controls
    document.getElementById('btn-zoom-in').onclick = () => zoom = Math.min(zoom + 0.3, 3);
    document.getElementById('btn-zoom-out').onclick = () => zoom = Math.max(zoom - 0.3, 0.8);
    document.getElementById('btn-reset').onclick = () => { zoom = 1; panX = 0; panY = 0; };

    // Initializations
    setInterval(spawnAttackArc, 800);
    renderMap();
    updateTables("24h");
  </script>
</body>
</html>
