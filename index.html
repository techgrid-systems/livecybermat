<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techgrid Systems - Live Cyber Threat Map</title>
  <style>
    :root {
      --bg-dark: #080b11;
      --panel-bg: rgba(14, 20, 32, 0.88);
      --panel-border: #1e293b;
      --primary-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --threat-red: #ef4444;
      --threat-orange: #f97316;
      --threat-yellow: #eab308;
      --threat-purple: #a855f7;
      --threat-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* Main Grid Layout */
    .dashboard-container {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      grid-template-rows: 1fr 140px;
      height: 100vh;
      width: 100vw;
      gap: 12px;
      padding: 12px;
    }

    /* Panels */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary-cyan);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    /* LEFT SIDEBAR */
    .left-sidebar {
      grid-column: 1;
      grid-row: 1;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .filter-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .filter-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid var(--text-muted);
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .filter-item input[type="checkbox"]:checked {
      background-color: var(--primary-cyan);
      border-color: var(--primary-cyan);
    }

    .filter-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #000;
      font-size: 11px;
      font-weight: bold;
      top: -1px;
      left: 3px;
    }

    .color-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* CENTER MAP */
    .map-container {
      grid-column: 2;
      grid-row: 1;
      position: relative;
      background: #04060a;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas#threatMap {
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .map-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-btn:hover {
      background: var(--primary-cyan);
      color: #000;
    }

    /* RIGHT SIDEBAR */
    .right-sidebar {
      grid-column: 3;
      grid-row: 1;
      gap: 12px;
      overflow-y: auto;
    }

    .interval-selector {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .interval-selector option {
      background: #0f172a;
      color: var(--text-main);
    }

    .table-container {
      margin-bottom: 12px;
    }

    .table-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 6px 8px;
      text-align: left;
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--panel-border);
    }

    td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .percentage-cell {
      text-align: right;
      font-weight: bold;
      color: var(--primary-cyan);
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.05);
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 3px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary-cyan);
      transition: width 0.3s ease;
    }

    /* BOTTOM LIVE FEED */
    .bottom-feed {
      grid-column: 1 / span 3;
      grid-row: 2;
    }

    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      height: 100%;
      font-family: monospace;
      font-size: 12px;
    }

    .feed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid var(--primary-cyan);
      border-radius: 4px;
    }

    .feed-type {
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      text-transform: uppercase;
    }

    .type-web { background: rgba(239, 68, 68, 0.2); color: var(--threat-red); }
    .type-ddos { background: rgba(249, 115, 22, 0.2); color: var(--threat-orange); }
    .type-intruder { background: rgba(234, 179, 8, 0.2); color: var(--threat-yellow); }
    .type-scammer { background: rgba(168, 85, 247, 0.2); color: var(--threat-purple); }
    .type-anonymizer { background: rgba(16, 185, 129, 0.2); color: var(--threat-green); }

    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--threat-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- LEFT PANEL: LOGO & ATTACK TYPE CHECKBOXES -->
    <div class="panel left-sidebar">
      <div class="brand-header">
        <img src="https://icons.techgrid-systems.org.uk/tgs-primary.png" alt="Techgrid Systems" class="brand-logo" onerror="this.src='https://via.placeholder.com/180x50/0e1420/06b6d4?text=Techgrid+Systems'">
        <span class="brand-title">Threat Intelligence Center</span>
      </div>

      <div class="panel-header">Attack Filters</div>

      <div class="filter-group">
        <label class="filter-item">
          <input type="checkbox" id="chk-web" checked>
          <span class="color-indicator" style="background: var(--threat-red);"></span>
          Web Attackers
        </label>

        <label class="filter-item">
          <input type="checkbox" id="chk-ddos" checked>
          <span class="color-indicator" style="background: var(--threat-orange);"></span>
          DDoS Attackers
        </label>

        <label class="filter-item">
          <input type="checkbox" id="chk-intruders" checked>
          <span class="color-indicator" style="background: var(--threat-yellow);"></span>
          Intruders
        </label>

        <label class="filter-item">
          <input type="checkbox" id="chk-scammers" checked>
          <span class="color-indicator" style="background: var(--threat-purple);"></span>
          Scammers
        </label>

        <label class="filter-item">
          <input type="checkbox" id="chk-anonymizers" checked>
          <span class="color-indicator" style="background: var(--threat-green);"></span>
          Anonymizers
        </label>
      </div>
    </div>

    <!-- CENTER PANEL: 2D MAP -->
    <div class="map-container">
      <div class="map-controls">
        <button class="map-btn" id="btn-zoom-in">+</button>
        <button class="map-btn" id="btn-zoom-out">-</button>
        <button class="map-btn" id="btn-reset">↺</button>
      </div>
      <canvas id="threatMap"></canvas>
    </div>

    <!-- RIGHT PANEL: TIMEFRAME & STATS TABLES -->
    <div class="panel right-sidebar">
      <div class="panel-header">
        <span>Threat Statistics</span>
        <span class="status-badge" id="live-indicator">LIVE STREAM</span>
      </div>

      <select class="interval-selector" id="interval-select">
        <option value="1h">Last 1 Hour</option>
        <option value="24h" selected>Last 24 Hours</option>
        <option value="1w">Last 1 Week</option>
        <option value="1m">Last 1 Month</option>
      </select>

      <!-- Top Attackers by Country -->
      <div class="table-container">
        <div class="table-title">Top Attackers by Country</div>
        <table>
          <thead>
            <tr>
              <th>Country</th>
              <th style="text-align: right;">Share</th>
            </tr>
          </thead>
          <tbody id="tbl-countries"></tbody>
        </table>
      </div>

      <!-- Top Network Attack Vectors -->
      <div class="table-container">
        <div class="table-title">Top Network Attack Vectors</div>
        <table>
          <thead>
            <tr>
              <th>Vector</th>
              <th style="text-align: right;">Share</th>
            </tr>
          </thead>
          <tbody id="tbl-vectors"></tbody>
        </table>
      </div>

      <!-- Top Application Violations -->
      <div class="table-container">
        <div class="table-title">Top Application Violations</div>
        <table>
          <thead>
            <tr>
              <th>Violation</th>
              <th style="text-align: right;">Share</th>
            </tr>
          </thead>
          <tbody id="tbl-violations"></tbody>
        </table>
      </div>
    </div>

    <!-- BOTTOM PANEL: CURRENT THREATS FEED -->
    <div class="panel bottom-feed">
      <div class="panel-header">
        <span>Live Threat Feed Stream</span>
        <span style="font-size: 10px; color: var(--threat-green);" id="feed-status">● AGGREGATOR CONNECTED</span>
      </div>
      <div class="feed-list" id="feed-list"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('threatMap');
    const ctx = canvas.getContext('2d');
    
    let zoom = 1;
    let panX = 0;
    let panY = 0;

    // Major Global Target Nodes
    const targetNodes = [
      { name: "London SOC", lat: 51.5074, lng: -0.1278 },
      { name: "New York Hub", lat: 40.7128, lng: -74.0060 },
      { name: "Tokyo Node", lat: 35.6762, lng: 139.6503 },
      { name: "Frankfurt DC", lat: 50.1109, lng: 8.6821 },
      { name: "Sydney Relay", lat: -33.8688, lng: 151.2093 },
      { name: "Singapore Gateway", lat: 1.3521, lng: 103.8198 }
    ];

    const attackTypes = {
      web: { label: "Web Attacker", color: "#ef4444", class: "type-web", checkId: "chk-web" },
      ddos: { label: "DDoS Attacker", color: "#f97316", class: "type-ddos", checkId: "chk-ddos" },
      intruders: { label: "Intruder", color: "#eab308", class: "type-intruder", checkId: "chk-intruders" },
      scammers: { label: "Scammer", color: "#a855f7", class: "type-scammer", checkId: "chk-scammers" },
      anonymizers: { label: "Anonymizer", color: "#10b981", class: "type-anonymizer", checkId: "chk-anonymizers" }
    };

    let activeArcs = [];
    const feedList = document.getElementById('feed-list');

    // Dynamic Live Aggregation Counter
    const liveStats = {
      total: 0,
      countries: {},
      vectors: {},
      violations: {}
    };

    // Geolocation Cache for Performance
    const geoCache = {};

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function geoToCanvas(lat, lng) {
      const x = ((lng + 180) / 360) * canvas.width;
      const y = ((90 - lat) / 180) * canvas.height;
      return { 
        x: (x * zoom) + panX + (canvas.width * (1 - zoom) / 2), 
        y: (y * zoom) + panY + (canvas.height * (1 - zoom) / 2) 
      };
    }

    // Process Incoming Live IOC Item
    async function processLiveThreat(ip, threatCategory, rawVector, rawViolation) {
      // Map category to dashboard filter
      let categoryKey = "intruders";
      const catLower = (threatCategory || '').toLowerCase();
      
      if (catLower.includes('web') || catLower.includes('url') || catLower.includes('http')) categoryKey = "web";
      else if (catLower.includes('ddos') || catLower.includes('flood') || catLower.includes('botnet')) categoryKey = "ddos";
      else if (catLower.includes('phish') || catLower.includes('scam') || catLower.includes('malware')) categoryKey = "scammers";
      else if (catLower.includes('tor') || catLower.includes('proxy') || catLower.includes('vpn')) categoryKey = "anonymizers";

      // Check Filter
      const isChecked = document.getElementById(attackTypes[categoryKey].checkId).checked;
      if (!isChecked) return;

      // Geolocate Real IP
      let geo = geoCache[ip];
      if (!geo) {
        try {
          const res = await fetch(`https://ip-api.com/json/${ip}?fields=status,country,city,lat,lon`);
          const data = await res.json();
          if (data.status === 'success') {
            geo = { country: data.country || 'Unknown', city: data.city || 'Unknown', lat: data.lat, lng: data.lon };
            geoCache[ip] = geo;
          }
        } catch (e) {
          // Fallback to random coordinate on network error
          geo = { country: "Remote Node", city: "Global", lat: (Math.random() * 120) - 60, lng: (Math.random() * 360) - 180 };
        }
      }

      if (!geo) return;

      const target = targetNodes[Math.floor(Math.random() * targetNodes.length)];

      // Spawn 2D Arc
      activeArcs.push({
        src: geo,
        dst: target,
        type: categoryKey,
        color: attackTypes[categoryKey].color,
        progress: 0,
        speed: 0.006 + Math.random() * 0.008
      });

      // Add Entry to Live Stream Log
      addFeedEntry(ip, geo, categoryKey, target.name);

      // Aggregate Real Statistics
      updateLiveAggregations(geo.country, rawVector || "SYN/UDP Flood", rawViolation || "HTTP Header Violation");
    }

    function addFeedEntry(ip, geo, typeKey, targetName) {
      const type = attackTypes[typeKey];
      const time = new Date().toLocaleTimeString();

      const item = document.createElement('div');
      item.className = 'feed-item';
      item.innerHTML = `
        <span>[${time}] IP: ${ip} (${geo.city}, ${geo.country})</span>
        <span class="feed-type ${type.class}">${type.label}</span>
        <span>Target: ${targetName}</span>
      `;

      feedList.prepend(item);
      if (feedList.children.length > 25) feedList.removeChild(feedList.lastChild);
    }

    function updateLiveAggregations(country, vector, violation) {
      liveStats.total++;
      liveStats.countries[country] = (liveStats.countries[country] || 0) + 1;
      liveStats.vectors[vector] = (liveStats.vectors[vector] || 0) + 1;
      liveStats.violations[violation] = (liveStats.violations[violation] || 0) + 1;

      renderTable('tbl-countries', liveStats.countries);
      renderTable('tbl-vectors', liveStats.vectors);
      renderTable('tbl-violations', liveStats.violations);
    }

    function renderTable(tableId, dataMap) {
      const tbody = document.getElementById(tableId);
      if (!tbody) return;

      const total = liveStats.total || 1;
      const sorted = Object.entries(dataMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      tbody.innerHTML = sorted.map(([name, count]) => {
        const pct = ((count / total) * 100).toFixed(1);
        return `
          <tr>
            <td>
              ${name}
              <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%"></div></div>
            </td>
            <td class="percentage-cell">${pct}%</td>
          </tr>
        `;
      }).join('');
    }

    // Render 2D Canvas Engine
    function renderMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid Lines
      ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw Target SOC Nodes
      targetNodes.forEach(node => {
        const pos = geoToCanvas(node.lat, node.lng);
        ctx.fillStyle = "#06b6d4";
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(148, 163, 184, 0.7)";
        ctx.font = "10px sans-serif";
        ctx.fillText(node.name, pos.x + 7, pos.y + 3);
      });

      // Render Trajectory Arcs
      activeArcs.forEach((arc, idx) => {
        arc.progress += arc.speed;
        if (arc.progress >= 1) {
          activeArcs.splice(idx, 1);
          return;
        }

        const start = geoToCanvas(arc.src.lat, arc.src.lng);
        const end = geoToCanvas(arc.dst.lat, arc.dst.lng);

        const midX = (start.x + end.x) / 2;
        const midY = (start.y + end.y) / 2 - 45;

        ctx.strokeStyle = arc.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.quadraticCurveTo(midX, midY, end.x, end.y);
        ctx.stroke();

        // Ballistic Particle
        const t = arc.progress;
        const px = (1 - t) * (1 - t) * start.x + 2 * (1 - t) * t * midX + t * t * end.x;
        const py = (1 - t) * (1 - t) * start.y + 2 * (1 - t) * t * midY + t * t * end.y;

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(renderMap);
    }

    // Connect to Live Threat Feeds
    async function fetchLiveFeeds() {
      try {
        // Fetch Real Live Threat Data from ThreatFox Public Intelligence Feed
        const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://threatfox-api.abuse.ch/v1/'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: 'get_iocs', days: 1 })
        });
        const data = await res.json();

        if (data.query_status === 'ok' && Array.isArray(data.data)) {
          const iocs = data.data.filter(item => item.ioc_type === 'ip:port');
          
          // Stream Live IOCs continuously
          let i = 0;
          const streamInterval = setInterval(() => {
            if (i >= iocs.length) {
              clearInterval(streamInterval);
              return;
            }
            const ioc = iocs[i];
            const ip = ioc.ioc.split(':')[0];
            processLiveThreat(ip, ioc.threat_type_desc, ioc.threat_type, ioc.malware_printable);
            i++;
          }, 1200);
        }
      } catch (err) {
        console.warn("Retrying Live Feed Stream Connection...", err);
      }
    }

    // Map Controls
    document.getElementById('btn-zoom-in').onclick = () => zoom = Math.min(zoom + 0.3, 3);
    document.getElementById('btn-zoom-out').onclick = () => zoom = Math.max(zoom - 0.3, 0.8);
    document.getElementById('btn-reset').onclick = () => { zoom = 1; panX = 0; panY = 0; };

    // Initializations
    renderMap();
    fetchLiveFeeds();
    setInterval(fetchLiveFeeds, 60000); // Pull fresh IOC batches every 60 seconds
  </script>
</body>
</html>
